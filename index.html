<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLiNER2.5 por dentro</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3EEE5; --paper: #FBF8F2; --wash: #F7F1E7; --line: #E3D9C8; --ink: #2B2926; --muted: #6E685F; --faint: #A39C90;
  --terra: #B85C3C; --terra-dark: #9C4A2E; --slate: #4D6170; --sand: #D4B48C; --olive: #7C8A5A;
  --serif: "Playfair Display", Georgia, serif; --sans: "Inter", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
body { display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; }

header { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 28px; align-items: end; padding: 18px 24px 14px; border-bottom: 1px solid var(--line); }
.brand h1 { font: 600 27px/1.1 var(--serif); margin: 0 0 4px; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
form { display: grid; grid-template-columns: 1fr minmax(180px, 280px) 180px auto; gap: 10px; align-items: end; }
.field label { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 2px; }
.field input[type=text] { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.field input[type=text]:focus { border-color: var(--terra); outline: none; }
.thr { display: flex; align-items: center; gap: 8px; padding: 9px 0; }
.thr input { flex: 1; accent-color: var(--terra); }
.thr output { font: 500 13px var(--mono); width: 40px; }
.primary { background: var(--terra); color: var(--paper); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; }
.primary:hover { background: var(--terra-dark); }
.primary:disabled { opacity: .55; cursor: progress; }
.sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.sub button { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
.sub button:hover { color: var(--terra); }
#status { margin-left: auto; font: 12px var(--mono); color: var(--faint); }

main { display: grid; grid-template-columns: 236px 1fr 430px; min-height: 0; }
#rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px; }
#rail .item { display: grid; align-content: start; grid-template-columns: 26px 1fr; gap: 2px 6px; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; border-radius: 0 10px 10px 0; padding: 8px 10px 8px 9px; color: var(--muted); }
#rail .item:hover { background: var(--wash); color: var(--ink); }
#rail .item.on { background: var(--paper); border-left-color: var(--terra); color: var(--ink); }
#rail .num { font: 500 12px/1.9 var(--mono); color: var(--faint); }
#rail .t { font-weight: 600; font-size: 14px; }
#rail .s { grid-column: 2; font-size: 12.5px; line-height: 1.4; }
.dots { grid-column: 2; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; }
.dots span { height: 15px; border-radius: 4px; background: var(--line); font: 9px/15px var(--mono); text-align: center; color: var(--muted); }
.dots span.on { background: var(--terra); color: var(--paper); }

#stage { position: relative; min-height: 0; overflow: hidden; }
#scene { display: block; width: 100%; height: 100%; }
.hud { position: absolute; display: flex; gap: 8px; align-items: center; }
.hud.tl { top: 14px; left: 14px; } .hud.tr { top: 14px; right: 14px; }
.hud.bc { bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px; box-shadow: 0 6px 22px rgba(70, 50, 30, .08); }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--paper); }
.ghost { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 11px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--faint); }
.icon { width: 34px; height: 34px; border: 0; background: none; border-radius: 9px; display: grid; place-items: center; color: var(--ink); }
.icon:hover { background: var(--wash); }
.icon.play { background: var(--terra); color: var(--paper); }
.icon.play:hover { background: var(--terra-dark); }
.icon svg, .ghost svg { width: 16px; height: 16px; }
#stepLabel { font-size: 13px; color: var(--muted); padding: 0 8px; min-width: 210px; text-align: center; white-space: nowrap; }
#stepLabel b { color: var(--ink); font-weight: 600; }
#mapCtl { display: none; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding: 0 6px; }
#mapCtl input[type=range] { width: 220px; accent-color: var(--terra); }
#mapCtl output { font: 500 13px var(--mono); color: var(--ink); width: 64px; }
#mapCtl label { display: inline-flex; gap: 5px; align-items: center; }
#busy { position: absolute; inset: 0; display: none; place-items: center; background: rgba(243, 238, 229, .72); font: 500 italic 20px var(--serif); color: var(--muted); }
#busy.on { display: grid; }
#hint { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); font-size: 13px; color: var(--muted); background: rgba(251, 248, 242, .9); padding: 5px 12px; border-radius: 8px; pointer-events: none; transition: opacity .4s; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; max-width: 290px; font-size: 13px; line-height: 1.45; box-shadow: 0 8px 24px rgba(70, 50, 30, .12); opacity: 0; transition: opacity .12s; }
#tip b { display: block; font-weight: 600; }
#tip span { color: var(--muted); display: block; }
#tip code { font: 12px var(--mono); }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 20; max-width: 90vw; }

#panel { border-left: 1px solid var(--line); overflow-y: auto; background: var(--paper); padding: 18px 24px 40px; }
.follow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.kicker { font: 500 12px var(--mono); color: var(--terra); letter-spacing: .02em; }
#panel h2 { font: 600 27px/1.15 var(--serif); margin: 4px 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 14px; }
[role=tablist] { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
[role=tab] { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 0 8px; font-size: 14px; color: var(--muted); margin-bottom: -1px; }
[role=tab][aria-selected=true] { color: var(--ink); border-bottom-color: var(--terra); font-weight: 600; }
#tabbody p { margin: 0 0 12px; }
#tabbody h3 { font: 600 17px var(--serif); margin: 20px 0 8px; }
#tabbody ol, #tabbody ul { padding-left: 20px; margin: 0 0 12px; }
#tabbody li { margin-bottom: 6px; }
.note { background: var(--wash); border-left: 3px solid var(--sand); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px; margin: 12px 0; }
.note.key { border-left-color: var(--terra); }
.mono, code { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--wash); padding: 1px 5px; border-radius: 5px; }
.lab { display: inline-flex; align-items: center; gap: 5px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, var(--paper)); border-radius: 999px; padding: 1px 9px 1px 7px; font-size: 13px; line-height: 1.5; white-space: nowrap; color: var(--ink); }
.lab::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
button.lab:hover { border-color: var(--c); }
button.lab.on { background: var(--c); color: var(--paper); border-color: var(--c); }
button.lab.on::before { background: var(--paper); }
.pc { display: inline-block; font: 12.5px/1.6 var(--mono); background: #EFE7DA; border-radius: 6px; padding: 0 6px; margin: 2px 1px; white-space: pre; }
.pc.marker { background: var(--slate); color: var(--paper); }
.pc.schema { background: #E4E7E8; }
.pc .id { color: var(--faint); font-size: 10.5px; margin-left: 4px; }
.pc.marker .id { color: #C9D2D8; }
.seq { font: 13px/2 var(--mono); background: var(--wash); border-radius: 10px; padding: 10px 12px; word-break: break-word; }
.seq b { color: var(--paper); background: var(--c, var(--slate)); border-radius: 5px; padding: 1px 5px; font-weight: 500; }
dl.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin: 12px 0; }
dl.legend dt { font: 500 12.5px var(--mono); }
dl.legend dd { margin: 0; color: var(--muted); }
.wordgroup { display: inline-flex; flex-direction: column; align-items: flex-start; margin: 0 8px 8px 0; vertical-align: top; }
.wordgroup small { font-size: 11px; color: var(--faint); }
.strip { display: grid; grid-template-columns: repeat(32, 1fr); gap: 1px; height: 18px; border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
.strips { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; align-items: center; font-size: 12.5px; }
.strips .strip { margin: 0; height: 13px; }
.bars { display: grid; grid-template-columns: auto 1fr 46px; gap: 5px 10px; align-items: center; font-size: 13px; }
.bar { height: 9px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--terra); border-radius: 5px; }
.num { font: 12.5px var(--mono); text-align: right; color: var(--muted); }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; margin: 6px 0 12px; }
.heat th { font-weight: 500; color: var(--muted); text-align: right; padding-right: 6px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.heat thead th { text-align: center; font: 10.5px var(--mono); padding: 0; }
.heat td { width: 20px; height: 16px; border-radius: 3px; }
.heat td.cur { outline: 2px solid var(--ink); outline-offset: -1px; }
.heat td.v { width: auto; min-width: 44px; height: 22px; font: 11.5px var(--mono); text-align: center; padding: 0 5px; }
.heat td.v.hit { font-weight: 600; color: var(--paper); }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 14px; }
.big div { background: var(--wash); border-radius: 10px; padding: 10px 12px; }
.big b { display: block; font: 500 24px var(--mono); }
.big span { font-size: 12.5px; color: var(--muted); }
.sentence { font-size: 17px; line-height: 2.2; background: var(--wash); border-radius: 10px; padding: 10px 14px; }
.sentence mark { background: color-mix(in srgb, var(--c) 18%, var(--paper)); border-bottom: 2px solid var(--c); padding: 2px 3px; border-radius: 4px; color: var(--ink); }
.sentence mark sup { font: 600 10px var(--sans); color: var(--c); margin-left: 3px; vertical-align: top; }
.gp { display: inline-block; font: 500 10.5px/1 var(--mono); color: var(--paper); background: var(--slate); border-radius: 4px; padding: 2px 4px; margin: 0 3px; vertical-align: middle; }
.marks { border-collapse: separate; border-spacing: 2px; font-size: 12px; margin: 8px 0 12px; }
.marks th { font-weight: 500; text-align: right; color: var(--muted); padding-right: 6px; }
.marks td { height: 22px; min-width: 20px; border-radius: 3px; font: 10.5px var(--mono); text-align: center; color: var(--ink); }
.marks td.w { padding: 0 4px; min-width: 32px; }
.marks thead td { background: none; font: 12px var(--sans); color: var(--ink); }
.marks thead td.g { color: var(--faint); font: 10px var(--mono); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 5px 0; font-size: 14px; }
.tech dt { font: 500 12.5px var(--mono); color: var(--ink); margin-top: 10px; }
.tech dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.file { font: 12px var(--mono); color: var(--faint); }

@media (max-width: 1100px) {
  body { height: auto; overflow: auto; }
  header { grid-template-columns: 1fr; gap: 12px; }
  form { grid-template-columns: 1fr 1fr; }
  main { grid-template-columns: 1fr; }
  #rail { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; gap: 4px; }
  #rail .item { min-width: 170px; border-left: 0; border-bottom: 3px solid transparent; border-radius: 10px 10px 0 0; }
  #rail .item.on { border-bottom-color: var(--terra); }
  #stage { height: 60vh; }
  #panel { border-left: 0; border-top: 1px solid var(--line); padding: 18px 16px 40px; }
  #stepLabel { min-width: 0; }
}
@media (max-width: 560px) {
  header { padding: 14px 16px 12px; }
  form { grid-template-columns: 1fr; }
  #stepLabel, #mapCtl input[type=range] { display: none; }
  .hud.tr { top: 60px; left: 14px; right: auto; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

} }

</head>
<body>
<header>
  <div class="brand">
    <h1>GLiNER2.5, por dentro</h1>
    <p>Sigue una frase a través del modelo, capa a capa, hasta que encuentra las entidades.</p>
  </div>
  <form id="form">
    <div class="field"><label for="text">Tu frase</label><input id="text" type="text" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label for="labels">Qué buscar (separado por comas)</label><input id="labels" type="text" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label for="thr">Umbral</label><div class="thr"><input id="thr" type="range" min="0.05" max="0.95" step="0.05" value="0.5"><output id="thrOut">0.50</output></div></div>
    <button class="primary" id="go" type="submit">Analizar</button>
    <div class="sub" id="examples"><span>Ejemplos:</span><span id="status"></span></div>
  </form>
</header>
<main>
  <nav id="rail" aria-label="Etapas del modelo"></nav>
  <section id="stage">
    <canvas id="scene" aria-label="Modelo en 3D"></canvas>
    <div class="hud tl">
      <div class="seg" role="group" aria-label="Vista">
        <button id="vFlow" class="on" type="button">Recorrido</button>
        <button id="vMap" type="button">Mapa de significados</button>
      </div>
    </div>
    <div class="hud tr">
      <button class="ghost" id="overview" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>Vista completa</button>
      <button class="ghost" id="sound" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h3l4-3v10l-4-3H2z"/><path id="waves" d="M11.5 5.5a3.5 3.5 0 0 1 0 5" opacity=".25"/></svg><span>Sonido: no</span></button>
    </div>
    <div class="hud bc">
      <div id="flowCtl" style="display:flex;align-items:center;gap:2px">
        <button class="icon" id="prev" type="button" aria-label="Paso anterior"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 3 5 8l5.5 5z"/></svg></button>
        <button class="icon play" id="play" type="button" aria-label="Recorrer el modelo"><svg viewBox="0 0 16 16" fill="currentColor"><path id="playIcon" d="M5 3v10l8-5z"/></svg></button>
        <button class="icon" id="next" type="button" aria-label="Paso siguiente"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 3 11 8l-5.5 5z"/></svg></button>
        <div id="stepLabel"></div>
      </div>
      <div id="mapCtl">
        <button class="icon play" id="mapPlay" type="button" aria-label="Recorrer las capas"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3v10l8-5z"/></svg></button>
        <span>Capa</span><input id="mapLayer" type="range" min="0" max="12" step="1" value="0"><output id="mapLayerOut">0</output>
        <label><input type="checkbox" id="trails"> trayectorias</label>
      </div>
    </div>
    <div id="hint">Pulsa ▶ para seguir tu frase. Arrastra para girar, clic derecho para desplazar, rueda para acercar.</div>
    <div id="busy">Pasando la frase por el modelo…</div>
  </section>
  <aside id="panel" aria-live="polite">
    <div class="follow" id="follow"></div>
    <div class="kicker" id="kicker"></div>
    <h2 id="ptitle">Cargando el modelo…</h2>
    <p class="lede" id="plede"></p>
    <div role="tablist" id="tabs">
      <button role="tab" data-tab="what" aria-selected="true">Qué hace</button>
      <button role="tab" data-tab="mine" aria-selected="false">Con tu frase</button>
      <button role="tab" data-tab="tech" aria-selected="false">Por dentro</button>
    </div>
    <div id="tabbody" role="tabpanel"></div>
  </aside>
</main>
<div id="tip"></div>
<div id="toast" role="alert"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f2 = (v) => Number(v).toFixed(2);
const nf = (n) => Number(n).toLocaleString("es-ES");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const argmax = (a) => a.reduce((b, v, i) => (v > a[b] ? i : b), 0);
const C = { bg: "#F3EEE5", paper: "#FBF8F2", wash: "#F7F1E7", plate: "#E8DFCE", ink: "#2B2926", muted: "#6E685F",
  terra: "#B85C3C", slate: "#4D6170", sand: "#D4B48C", olive: "#7C8A5A", schema: "#C3C9CD" };
const LABEL_COLORS = ["#B85C3C", "#4D6170", "#7C8A5A", "#C0913A", "#8A5A6E", "#4F7F78", "#8C6A4F", "#6E6A9A"];
const LC = (q) => LABEL_COLORS[q % LABEL_COLORS.length];
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * clamp(t, 0, 1))).join(",")})`; };
const ramp = (v, to = C.terra) => mix(C.paper, to, v);
const diverge = (v) => (v >= 0 ? mix(C.paper, C.terra, v) : mix(C.paper, C.slate, -v));

// ---------- state ----------
const S = { step: 0, overview: true, label: 0, focusTok: 0, view: "flow", tab: "what", playing: false, sound: false, mapLayer: 0, mapPlaying: false };
let INFO = null, D = null, STEPS = [], plates = [];

const EXAMPLES = [
  { name: "Empresa y ciudad", text: "María García trabaja en Telefónica en Madrid desde 2019.", labels: "persona, empresa, ciudad, fecha" },
  { name: "Historia clínica", text: "El paciente Juan Pérez, de 54 años, ingresó en el Hospital La Paz el 3 de marzo con neumonía.", labels: "persona, edad, hospital, fecha, enfermedad" },
  { name: "Transferencia", text: "Ana López envió 1.200 euros a la cuenta ES91 2100 0418 4502 0005 1332 el lunes.", labels: "persona, cantidad de dinero, número de cuenta, fecha" },
  { name: "Palabra ambigua", text: "Me senté en un banco del parque antes de ir al Banco de España.", labels: "lugar, organización, mueble" },
];

const GROUPS = [
  { key: "input", title: "Texto y etiquetas", short: "Tu frase y la lista de cosas que quieres encontrar." },
  { key: "tokens", title: "Tokenizador", short: "Corta el texto en piezas que el modelo conoce." },
  { key: "embed", title: "Fichas (embeddings)", short: "Cada pieza se cambia por una lista de números." },
  { key: "layer", title: "Transformer", short: "Cada pieza mira a las demás y se actualiza." },
  { key: "pick", title: "Representantes", short: "Un vector por palabra y otro por etiqueta." },
  { key: "gaps", title: "Huecos entre palabras", short: "Una entidad empieza en un hueco y acaba en otro." },
  { key: "marks", title: "¿Empieza? ¿Acaba?", short: "Cada etiqueta puntúa cada hueco y cada palabra." },
  { key: "pool", title: "Candidatos", short: "Combina los inicios y finales más prometedores." },

    mine: () => {

    tech: () => `<dl class="tech"><dt>Tokenizador</dt><dd>SentencePiece (Unigram) de mDeBERTa-v3, ${nf(INFO.vocab)} entradas, multilingüe.</dd>

      <dt>Palabras</dt><dd>El procesador separa primero el texto en palabras (con sus posiciones de carácter) y luego tokeniza cada una. Así sabe qué piezas forman cada palabra.</dd></dl>`,
  },
  embed: {
    what: () => `<p>Cada pieza se cambia por su <b>ficha</b>: una lista de <b>${INFO.hidden} números</b> que resume lo que el modelo aprendió sobre ella durante el entrenamiento.</p>
      <p>Todavía <b>no mira el contexto</b>: «banco» tiene la misma ficha en «banco del parque» y en «Banco de España». El contexto llega en las capas siguientes.</p>
      <div class="note">Esta tabla de fichas es enorme: ${nf(INFO.params.embeddings)} números, el <b>${pctOf(INFO.params.embeddings, INFO.params.total)} %</b> de todo el modelo. Es el diccionario: una fila por pieza.</div>`,
    mine: () => {
      const L0 = D.layers[0], f = S.focusTok, t = D.tokens[f];

        <h3>Más fichas</h3><div class="strips">${show.map((k) => `<span>${pc(D.tokens[k])}${D.tokens[k].label != null ? " " + labChip(D.tokens[k].label) : ""}</span>${strip(L0.strip[k])}`).join("")}</div>

  layer: {
    what: (st) => `<p>Cada capa hace dos cosas:</p>
      <ol><li><b>Atención.</b> Cada pieza pregunta a las demás «¿quién me ayuda a entenderme?» y mezcla su información según la respuesta. Las líneas terracota del 3D muestran a quién mira la pieza seleccionada.</li>
      <li><b>Reflexión</b> (red <i>feed-forward</i>). Cada pieza procesa a solas lo que ha recogido.</li></ol>
      <p>Esto se repite ${INFO.layers} veces. Las primeras capas captan forma y vecindad; las últimas, significado y papel en la frase.</p>

      <p style="color:var(--muted);font-size:13px">Estás en la capa ${st.layer} de ${INFO.layers}. La altura de cada pieza indica cuánto la mira la pieza seleccionada (en negro).</p>`,
    mine: (st) => {

        <h3>Cómo mira ${labChip(q)} a tu frase, capa a capa</h3>
        <table class="heat"><thead><tr><th></th>${cols.map((_, l) => `<th>${l + 1}</th>`).join("")}</tr></thead><tbody>
        ${ws.map((w, j) => `<tr><th>${esc(w)}</th>${cols.map((c, l) => `<td class="${l + 1 === st.layer ? "cur" : ""}" style="background:${ramp(c[j], LC(q))}" title="capa ${l + 1}: ${f2(D.layers[l + 1].label_attn[q][j])}"></td>`).join("")}</tr>`).join("")}
        </tbody></table>
        <p>En la capa ${st.layer}, ${labChip(q)} mira sobre todo a <b>«${esc(ws[nowBest])}»</b>. En la última capa, a <b>«${esc(ws[endBest])}»</b>.</p>`;
    },
    tech: (st) => `<dl class="tech"><dt>Atención</dt><dd>${INFO.heads} cabezas en paralelo, cada una con su propio criterio. Aquí se muestra la media. DeBERTa separa «qué dice» (contenido) y «dónde está» (posición relativa) al calcular la atención.</dd>
      <dt>Feed-forward</dt><dd>${INFO.hidden} → ${INFO.hidden * 4} → ${INFO.hidden} con GELU, conexión residual y LayerNorm tras cada bloque.</dd>
      <dt>Forma</dt><dd>Entrada y salida <code>[1, ${D.T}, ${INFO.hidden}]</code>. Atención <code>[1, ${INFO.heads}, ${D.T}, ${D.T}]</code>.</dd>
      <dt>Parámetros</dt><dd>${nf(INFO.params.layer)} por capa × ${INFO.layers} capas.</dd>
      <dt>Código</dt><dd class="file">transformers · DebertaV2Layer (capa ${st.layer})</dd></dl>`,
  },
  pick: {
    what: () => `<p>Tras las ${INFO.layers} capas, toca volver a <b>palabras</b>. Cada palabra se representa con su <b>primera pieza</b> (la que lleva <code>▁</code>). Esa pieza ya ha absorbido el contexto de las demás.</p>
      <p>Cada etiqueta se representa con su marcador <code>[E]</code>. Ese vector es <b>la pregunta</b> que se hará al texto: «¿dónde hay una ${esc(D.input.labels[S.label])}?».</p>
      <p>El resto de piezas (los trozos finales de palabra y el esquema) ya cumplieron su función y se descartan. En el 3D, las bolitas que suben y se desvanecen son esas piezas.</p>`,
    mine: () => {
      const sim = D.layers.at(-1).label_sim;
      return `<p>Palabra ← pieza elegida:</p><div>${D.words.map((w) => `<span class="wordgroup">${pc(D.tokens[w.token])}<small>${esc(w.text)}</small></span>`).join("")}</div>
        <h3>Parecido entre cada etiqueta y cada palabra</h3><p style="font-size:13px;color:var(--muted)">Similitud del coseno tras la última capa. Es solo una pista: la decisión real la toman las etapas siguientes.</p>
        <table class="heat"><thead><tr><th></th>${D.words.map((w) => `<th title="${esc(w.text)}">${esc(w.text.slice(0, 4))}</th>`).join("")}</tr></thead><tbody>
        ${D.input.labels.map((l, q) => { const r = sim[q], mn = Math.min(...r), mx = Math.max(...r); return `<tr><th>${esc(l)}</th>${r.map((v, j) => `<td style="background:${ramp((v - mn) / (mx - mn || 1), LC(q))}" title="${esc(D.words[j].text)}: ${f2(v)}"></td>`).join("")}</tr>`; }).join("")}
        </tbody></table>`;
    },

      <dt>Salidas</dt><dd>Texto <code>[1, ${D.W}, ${INFO.hidden}]</code> y consultas (marcadores <code>[E]</code>) <code>[1, ${D.Q}, ${INFO.hidden}]</code>.</dd>
      <dt>Código</dt><dd class="file">gliner2/models/boundary/model.py · _encode_core</dd></dl>`,
  },
  gaps: {
    what: () => `<p>Una entidad es un tramo de texto: <b>empieza en un hueco y acaba en otro</b>. Por eso el modelo deja de mirar palabras y mira los <b>huecos entre palabras</b>.</p>
      <p>Con ${D.W} palabras hay ${D.W + 1} huecos: uno antes de la primera, uno entre cada par y uno al final. Cada hueco se describe mezclando la palabra de su izquierda y la de su derecha.</p>
      <p>Luego los huecos se miran entre sí (2 capas de atención) para afinar su descripción.</p>

    mine: () => {
      const e = D.entities[0];

    },
    tech: () => `<dl class="tech"><dt>BoundaryEncoder</dt><dd>Proyecciones izquierda y derecha ${INFO.hidden} → ${INFO.boundary_dim}, concatenación → ${INFO.boundary_dim}, LayerNorm, ${INFO.boundary_attention_layers} bloques de atención con ventana de ${INFO.boundary_attention_window} huecos y 1 bloque SwiGLU residual.</dd>
      <dt>Forma</dt><dd><code>[1, ${D.W + 1}, ${INFO.boundary_dim}]</code>. Los extremos usan vectores aprendidos de «inicio» y «fin» de texto.</dd>

  },
  marks: {
    what: () => `<p>Ahora entra la pregunta. El vector de la etiqueta se compara con cada hueco y con cada palabra. Salen tres notas de 0 a 1:</p>
      <ul><li><b style="color:var(--terra)">Empieza</b>: ¿empieza aquí una entidad de este tipo?</li><li><b style="color:var(--slate)">Acaba</b>: ¿acaba aquí?</li><li><b style="color:var(--olive)">Dentro</b>: ¿esta palabra forma parte de una?</li></ul>

    mine: () => {
      const q = S.label, B = D.boundary, s = argmax(B.start[q]), e = argmax(B.end[q]);

        if (j < D.W) { head += `<td class="w">${esc(D.words[j].text)}</td>`; r1 += "<td></td>"; r2 += cell(B.inside[q][j], C.olive); r3 += "<td></td>"; }

    tech: () => `<dl class="tech"><dt>BoundaryQueryHead</dt><dd>Productos escalares escalados entre proyecciones (${INFO.boundary_dim} dims) de los huecos y de la consulta. <code>start_logits</code> y <code>end_logits</code> <code>[1, ${D.Q}, ${D.W + 1}]</code>; <code>inside_logits</code> <code>[1, ${D.Q}, ${D.W}]</code>.</dd>

  },
  pool: {
    what: () => `<p>Probar todos los tramos posibles sale caro. Con ${D.W} palabras hay ${nf(D.pool.possible)}; en un documento de 500 palabras serían más de 125.000.</p>

        <ul class="list">${top.map((c) => `<li><span>«${esc(c.text)}»</span><span class="num">${c.s}→${c.e} · ${f2(c.prior)}</span></li>`).join("")}</ul>`;
    },
    tech: () => `<dl class="tech"><dt>DocumentCandidatePool</dt><dd>Máximo de start/end logits sobre las etiquetas, top-${INFO.pool_top_k} por lado, producto cartesiano con fin > inicio, compatibilidad inicio·fin, cuota mínima por etiqueta y deduplicación.</dd>

  score: {

      <p>En el 3D, cuanto más alto el arco, mayor la probabilidad para ${labChip(S.label)}. Los arcos gruesos superan el umbral (${f2(D.input.threshold)}).</p>`,

    tech: () => `<dl class="tech"><dt>SharedPoolScorer</dt><dd>Vector del candidato = inicio + fin + rasgos de longitud (log, relativa, 1/√) + nota previa + contenido (media y log-sum-exp del tramo), con LayerNorm.</dd>

  decide: {
    what: () => `<p>Quedan tres filtros:</p>

    mine: () => {

      <dt>Código</dt><dd class="file">gliner2/models/boundary/engine.py · _decode_entities</dd></dl>`,

  map: {
    what: () => `<p>Cada punto es una pieza de tu entrada. Sus ${INFO.hidden} números no se pueden dibujar, así que los resumimos en 3 (análisis de componentes principales). <b>Piezas cercanas = representaciones parecidas.</b></p>
      <p>Mueve la capa o pulsa ▶. En las fichas (capa 0) los marcadores <code>[E]</code> están en el mismo punto, porque aún no saben de qué etiqueta son. Capa a capa se separan y el texto se reorganiza según su papel en la frase.</p>

      const L = D.layers[S.mapLayer];
      return `<p>En ${S.mapLayer === 0 ? "las fichas (capa 0)" : `la capa ${S.mapLayer}`}, cada etiqueta se parece más a:</p>
        <ul class="list">${D.input.labels.map((l, q) => { const j = argmax(L.label_sim[q]); return `<li><span>${labChip(q)} → «${esc(D.words[j].text)}»</span><span class="num">${f2(L.label_sim[q][j])}</span></li>`; }).join("")}</ul>
        ${S.mapLayer === 0 ? `<p style="font-size:13px;color:var(--muted);margin-top:8px">En la capa 0 todas las etiquetas dan la misma respuesta: sus marcadores son idénticos.</p>` : ""}`;
    },
    tech: () => `<dl class="tech"><dt>Proyección</dt><dd>PCA a 3 dimensiones de los vectores normalizados de cada capa, alineada con la capa anterior (Procrustes) para que los puntos se muevan de forma continua.</dd>
      <dt>Parecido</dt><dd>Similitud del coseno entre el vector del marcador <code>[E]</code> y la primera pieza de cada palabra, en ${INFO.hidden} dimensiones.</dd></dl>`,
  },
};
function techModel() {
  const P = INFO.params;
  return `<dl class="tech"><dt>Modelo</dt><dd><code>${esc(INFO.name)}</code>: encoder ${esc(INFO.encoder)} (mDeBERTa-v3) + cabeza de fronteras.</dd>
    <dt>Tamaño</dt><dd>${nf(P.total)} parámetros: fichas ${pctOf(P.embeddings, P.total)} %, capas Transformer ${pctOf(P.encoder - P.embeddings, P.total)} %, cabeza de fronteras ${((100 * (P.boundary_encoder + P.query_head + P.pool + P.scorer)) / P.total).toFixed(1)} %.</dd>
    <dt>Encoder</dt><dd>${INFO.layers} capas, ${INFO.hidden} dimensiones, ${INFO.heads} cabezas de atención.</dd>
    <dt>Cabeza</dt><dd>Huecos ${INFO.boundary_dim} dims · bolsa top-${INFO.pool_top_k} × top-${INFO.pool_top_k}, máximo ${INFO.pool_size} candidatos.</dd>
    <dt>Lo que no se muestra</dt><dd>El mismo modelo también clasifica textos y extrae relaciones y registros; aquí solo se recorre la extracción de entidades.</dd></dl>`;
}
function renderPanel() {
  if (!INFO) return;
  $("#follow").innerHTML = D ? `<span>Sigues la etiqueta:</span>${D.input.labels.map((l, q) => `<button type="button" class="lab ${q === S.label ? "on" : ""}" style="--c:${LC(q)}" data-q="${q}">${esc(l)}</button>`).join("")}` : "";
  if (!D) return;
  const key = S.view === "map" ? "map" : S.overview ? "overview" : STEPS[S.step].key;
  const st = STEPS[S.step], g = GROUPS[st.g];
  $("#kicker").textContent = S.view === "map" ? "Vista alternativa" : S.overview ? `${STEPS.length} pasos · ${GROUPS.length} etapas` : `Paso ${S.step + 1} de ${STEPS.length}`;
  $("#ptitle").textContent = S.view === "map" ? "Mapa de significados" : S.overview ? "Una frase atraviesa el modelo" : stepTitle(st) + (st.key === "layer" ? " · Transformer" : "");
  $("#plede").textContent = S.view === "map" ? "Dónde coloca el modelo cada pieza, capa a capa." : S.overview ? "De tu texto a las entidades, en diez etapas." : g.short;
  document.querySelectorAll("[role=tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  $("#tabbody").innerHTML = CONTENT[key][S.tab](st);
}
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; S.tab = b.dataset.tab; renderPanel(); blip(600, 0.05, 0.012); });
$("#follow").addEventListener("click", (e) => { const b = e.target.closest("[data-q]"); if (b) setLabel(+b.dataset.q); });

// ---------- data ----------
function prep(d) {
  let cur = null;
  d.tokens.forEach((t) => {
    if (t.kind === "marker") { cur = t.label; t.lab = t.label; }
    else if (t.kind === "schema") { if (t.piece.includes(")")) cur = null; t.lab = cur != null && /[\p{L}\p{N}]/u.test(t.piece) ? cur : null; }
    else t.lab = null;
  });
  d.W = d.words.length; d.Q = d.input.labels.length; d.T = d.tokens.length;
  d.candidates.forEach((c) => (c.final = d.entities.filter((e) => e.start === c.cs && e.end === c.ce).map((e) => e.label)));
  const up = /[A-ZÁÉÍÓÚÑÜ]/;
  d.lower = up.test(d.input.text) && !d.tokens.some((t) => t.kind === "text" && up.test(t.piece));
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 5000); }
async function analyze() {
  const body = { text: $("#text").value, labels: $("#labels").value.split(",").map((s) => s.trim()).filter(Boolean), threshold: +$("#thr").value };
  $("#go").disabled = true; $("#busy").classList.add("on"); stopPlay();
  try {
    const r = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    const first = !D;
    prep(j); D = j;
    S.label = 0; S.focusTok = D.markers[0]; S.mapLayer = first ? 0 : S.mapLayer;
    buildTower(); buildMap(); updateHeights();
    $("#status").textContent = `${INFO.name} · ${D.ms} ms`;
    if (first || S.overview) overview(); else selectStep(S.step);
    if (S.view === "map") setView("map");
    renderRail(); renderPanel();
  } catch (e) {
    toast(e instanceof TypeError ? "No encuentro el servidor. Arráncalo con: uv run server.py" : e.message);
  } finally { $("#go").disabled = false; $("#busy").classList.remove("on"); }
}

// ---------- wiring ----------
$("#form").addEventListener("submit", (e) => { e.preventDefault(); analyze(); });
$("#thr").addEventListener("input", (e) => ($("#thrOut").textContent = f2(e.target.value)));
EXAMPLES.forEach((x) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = x.name;
  b.onclick = () => { $("#text").value = x.text; $("#labels").value = x.labels; analyze(); };
  $("#status").before(b);
});
$("#prev").onclick = () => { stopPlay(); S.overview ? selectStep(0) : selectStep(S.step - 1); };
$("#next").onclick = () => { stopPlay(); S.overview ? selectStep(0) : selectStep(S.step + 1, { flow: true }); };
$("#play").onclick = play;
$("#overview").onclick = overview;
$("#vFlow").onclick = () => setView("flow");
$("#vMap").onclick = () => setView("map");
$("#mapLayer").oninput = (e) => { S.mapLayer = +e.target.value; S.mapPlaying = false; mapRefresh(); };
$("#mapPlay").onclick = mapPlay;
$("#trails").onchange = mapRefresh;
$("#sound").onclick = () => {
  S.sound = !S.sound;
  $("#sound").setAttribute("aria-pressed", S.sound);
  $("#sound span").textContent = `Sonido: ${S.sound ? "sí" : "no"}`;
  $("#waves").setAttribute("opacity", S.sound ? 1 : 0.25);
  chime();
};
addEventListener("keydown", (e) => {
  if (!D || e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); $("#next").click(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); $("#prev").click(); }
  if (e.key === " ") { e.preventDefault(); S.view === "map" ? mapPlay() : play(); }
});

// ---------- start ----------
(async () => {
  renderRail();
  await Promise.all(['500 52px Inter', '600 58px "Playfair Display"', '500 44px "IBM Plex Mono"'].map((f) => document.fonts.load(f))).catch(() => {});
  try {
    INFO = await (await fetch("/api/info")).json();
  } catch {
    $("#ptitle").textContent = "Servidor no disponible";
    $("#tabbody").innerHTML = `<p>Arranca el servidor desde esta carpeta:</p><p><code>uv run server.py</code></p><p>y abre <code>http://localhost:8765</code>.</p>`;
    return;
  }
  buildSteps(INFO.layers);
  $("#mapLayer").max = INFO.layers;
  renderRail();
  $("#text").value = EXAMPLES[0].text; $("#labels").value = EXAMPLES[0].labels;
  analyze();
})();
</script>
</body>
</html>
