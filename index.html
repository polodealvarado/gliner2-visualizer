<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside GLiNER2.5</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3EEE5; --paper: #FBF8F2; --wash: #F7F1E7; --line: #E3D9C8; --ink: #2B2926; --muted: #6E685F; --faint: #A39C90;
  --terra: #B85C3C; --terra-dark: #9C4A2E; --slate: #4D6170; --sand: #D4B48C; --olive: #7C8A5A;
  --serif: "Playfair Display", Georgia, serif; --sans: "Inter", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
body { display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; }

header { display: grid; grid-template-columns: minmax(220px, 300px) 1fr; gap: 28px; align-items: end; padding: 18px 24px 14px; border-bottom: 1px solid var(--line); }
.brand h1 { font: 600 27px/1.1 var(--serif); margin: 0 0 4px; letter-spacing: -0.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
form { display: grid; grid-template-columns: 1fr 180px auto; gap: 10px; align-items: end; }
.tasks { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.tasks input[type=text] { font-size: 13.5px; padding: 7px 10px; }
.field label { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px 2px; }
.field input[type=text] { width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.field input[type=text]:focus { border-color: var(--terra); outline: none; }
.thr { display: flex; align-items: center; gap: 8px; padding: 9px 0; }
.thr input { flex: 1; accent-color: var(--terra); }
.thr output { font: 500 13px var(--mono); width: 40px; }
.primary { background: var(--terra); color: var(--paper); border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 600; }
.primary:hover { background: var(--terra-dark); }
.primary:disabled { opacity: .55; cursor: progress; }
.sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.sub button { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline dotted var(--faint); text-underline-offset: 3px; }
.sub button:hover { color: var(--terra); }
#status { margin-left: auto; font: 12px var(--mono); color: var(--faint); }

main { display: grid; grid-template-columns: 236px 1fr 430px; min-height: 0; }
#rail { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px; }
#rail .item { display: grid; align-content: start; grid-template-columns: 26px 1fr; gap: 2px 6px; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; border-radius: 0 10px 10px 0; padding: 8px 10px 8px 9px; color: var(--muted); }
#rail .item:hover { background: var(--wash); color: var(--ink); }
#rail .item.on { background: var(--paper); border-left-color: var(--terra); color: var(--ink); }
#rail .num { font: 500 12px/1.9 var(--mono); color: var(--faint); }
#rail .t { font-weight: 600; font-size: 14px; }
#rail .s { grid-column: 2; font-size: 12.5px; line-height: 1.4; }
.dots { grid-column: 2; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 6px; }
.dots span { height: 15px; border-radius: 4px; background: var(--line); font: 9px/15px var(--mono); text-align: center; color: var(--muted); }
.dots span.on { background: var(--terra); color: var(--paper); }

#stage { position: relative; min-height: 0; overflow: hidden; }
#scene { display: block; width: 100%; height: 100%; }
.hud { position: absolute; display: flex; gap: 8px; align-items: center; }
.hud.tl { top: 14px; left: 14px; } .hud.tr { top: 14px; right: 14px; }
.hud.bc { bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px; box-shadow: 0 6px 22px rgba(70, 50, 30, .08); }
.seg { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 7px; padding: 5px 11px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--ink); color: var(--paper); }
.ghost { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 6px 11px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.ghost:hover { color: var(--ink); border-color: var(--faint); }
.icon { width: 34px; height: 34px; border: 0; background: none; border-radius: 9px; display: grid; place-items: center; color: var(--ink); }
.icon:hover { background: var(--wash); }
.icon.play { background: var(--terra); color: var(--paper); }
.icon.play:hover { background: var(--terra-dark); }
.icon svg, .ghost svg { width: 16px; height: 16px; }
#stepLabel { font-size: 13px; color: var(--muted); padding: 0 8px; min-width: 210px; text-align: center; white-space: nowrap; }
#stepLabel b { color: var(--ink); font-weight: 600; }
#mapCtl { display: none; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding: 0 6px; }
#mapCtl input[type=range] { width: 220px; accent-color: var(--terra); }
#mapCtl output { font: 500 13px var(--mono); color: var(--ink); width: 86px; }
#mapCtl label { display: inline-flex; gap: 5px; align-items: center; }
#busy { position: absolute; inset: 0; display: none; place-items: center; background: rgba(243, 238, 229, .72); font: 500 italic 20px var(--serif); color: var(--muted); }
#busy.on { display: grid; }
#hint { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); font-size: 13px; color: var(--muted); background: rgba(251, 248, 242, .9); padding: 5px 12px; border-radius: 8px; pointer-events: none; transition: opacity .4s; }

#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; max-width: 290px; font-size: 13px; line-height: 1.45; box-shadow: 0 8px 24px rgba(70, 50, 30, .12); opacity: 0; transition: opacity .12s; }
#tip b { display: block; font-weight: 600; }
#tip span { color: var(--muted); display: block; }
#tip code { font: 12px var(--mono); }
#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 10px; font-size: 14px; display: none; z-index: 20; max-width: 90vw; }

#panel { border-left: 1px solid var(--line); overflow-y: auto; background: var(--paper); padding: 18px 24px 40px; }
.follow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.kicker { font: 500 12px var(--mono); color: var(--terra); letter-spacing: .02em; }
#panel h2 { font: 600 27px/1.15 var(--serif); margin: 4px 0 6px; letter-spacing: -0.01em; }
.lede { color: var(--muted); margin: 0 0 14px; }
[role=tablist] { display: flex; gap: 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
[role=tab] { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 0 8px; font-size: 14px; color: var(--muted); margin-bottom: -1px; }
[role=tab][aria-selected=true] { color: var(--ink); border-bottom-color: var(--terra); font-weight: 600; }
#tabbody p { margin: 0 0 12px; }
#tabbody h3 { font: 600 17px var(--serif); margin: 20px 0 8px; }
#tabbody ol, #tabbody ul { padding-left: 20px; margin: 0 0 12px; }
#tabbody li { margin-bottom: 6px; }
.note { background: var(--wash); border-left: 3px solid var(--sand); padding: 10px 12px; border-radius: 0 8px 8px 0; font-size: 14px; margin: 12px 0; }
.note.key { border-left-color: var(--terra); }
.mono, code { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--wash); padding: 1px 5px; border-radius: 5px; }
.lab { display: inline-flex; align-items: center; gap: 5px; border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, var(--paper)); border-radius: 999px; padding: 1px 9px 1px 7px; font-size: 13px; line-height: 1.5; white-space: nowrap; color: var(--ink); }
.lab::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
button.lab:hover { border-color: var(--c); }
button.lab.on { background: var(--c); color: var(--paper); border-color: var(--c); }
button.lab.on::before { background: var(--paper); }
.pc { display: inline-block; font: 12.5px/1.6 var(--mono); background: #EFE7DA; border-radius: 6px; padding: 0 6px; margin: 2px 1px; white-space: pre; }
.pc.marker { background: var(--slate); color: var(--paper); }
.pc.schema { background: #E4E7E8; }
.pc .id { color: var(--faint); font-size: 10.5px; margin-left: 4px; }
.pc.marker .id { color: #C9D2D8; }
.seq { font: 13px/2 var(--mono); background: var(--wash); border-radius: 10px; padding: 10px 12px; word-break: break-word; }
.seq b { color: var(--paper); background: var(--c, var(--slate)); border-radius: 5px; padding: 1px 5px; font-weight: 500; }
dl.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 14px; margin: 12px 0; }
dl.legend dt { font: 500 12.5px var(--mono); }
dl.legend dd { margin: 0; color: var(--muted); }
.wordgroup { display: inline-flex; flex-direction: column; align-items: flex-start; margin: 0 8px 8px 0; vertical-align: top; }
.wordgroup small { font-size: 11px; color: var(--faint); }
.strip { display: grid; grid-template-columns: repeat(32, 1fr); gap: 1px; height: 18px; border-radius: 4px; overflow: hidden; margin: 4px 0 10px; }
.strips { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; align-items: center; font-size: 12.5px; }
.strips .strip { margin: 0; height: 13px; }
.bars { display: grid; grid-template-columns: auto 1fr 46px; gap: 5px 10px; align-items: center; font-size: 13px; }
.bar { height: 9px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--terra); border-radius: 5px; }
.num { font: 12.5px var(--mono); text-align: right; color: var(--muted); }
.heat { border-collapse: separate; border-spacing: 2px; font-size: 12px; margin: 6px 0 12px; }
.heat th { font-weight: 500; color: var(--muted); text-align: right; padding-right: 6px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
.heat thead th { text-align: center; font: 10.5px var(--mono); padding: 0; }
.heat td { width: 20px; height: 16px; border-radius: 3px; }
.heat td.cur { outline: 2px solid var(--ink); outline-offset: -1px; }
.heat td.v { width: auto; min-width: 44px; height: 22px; font: 11.5px var(--mono); text-align: center; padding: 0 5px; }
.heat td.v.hit { font-weight: 600; color: var(--paper); }
.big { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 14px; }
.big div { background: var(--wash); border-radius: 10px; padding: 10px 12px; }
.big b { display: block; font: 500 24px var(--mono); }
.big span { font-size: 12.5px; color: var(--muted); }
.sentence { font-size: 17px; line-height: 2.2; background: var(--wash); border-radius: 10px; padding: 10px 14px; }
.sentence mark { background: color-mix(in srgb, var(--c) 18%, var(--paper)); border-bottom: 2px solid var(--c); padding: 2px 3px; border-radius: 4px; color: var(--ink); }
.sentence mark sup { font: 600 10px var(--sans); color: var(--c); margin-left: 3px; vertical-align: top; }
.gp { display: inline-block; font: 500 10.5px/1 var(--mono); color: var(--paper); background: var(--slate); border-radius: 4px; padding: 2px 4px; margin: 0 3px; vertical-align: middle; }
.marks { border-collapse: separate; border-spacing: 2px; font-size: 12px; margin: 8px 0 12px; }
.marks th { font-weight: 500; text-align: right; color: var(--muted); padding-right: 6px; }
.marks td { height: 22px; min-width: 20px; border-radius: 3px; font: 10.5px var(--mono); text-align: center; color: var(--ink); }
.marks td.w { padding: 0 4px; min-width: 32px; }
.marks thead td { background: none; font: 12px var(--sans); color: var(--ink); }
.marks thead td.g { color: var(--faint); font: 10px var(--mono); }
.list { margin: 0; padding: 0; list-style: none; }
.list li { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 5px 0; font-size: 14px; }
.tech dt { font: 500 12.5px var(--mono); color: var(--ink); margin-top: 10px; }
.tech dd { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.file { font: 12px var(--mono); color: var(--faint); }
.follow .fg { display: inline-flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-right: 8px; }
.follow .fg small { font: 500 11px var(--mono); color: var(--faint); }
.seq .segl { display: block; }
.seq small { font: 500 10.5px var(--sans); color: var(--faint); text-transform: uppercase; letter-spacing: .05em; margin-right: 6px; }
.pc.desc { background: #F1E6D3; color: var(--muted); }

@media (max-width: 1100px) {
  body { height: auto; overflow: auto; }
  header { grid-template-columns: 1fr; gap: 12px; }
  form { grid-template-columns: 1fr auto; }
  form > .field:first-child { grid-column: 1 / -1; }
  .tasks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  main { grid-template-columns: 1fr; }
  #rail { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 16px; gap: 4px; }
  #rail .item { min-width: 170px; border-left: 0; border-bottom: 3px solid transparent; border-radius: 10px 10px 0 0; }
  #rail .item.on { border-bottom-color: var(--terra); }
  #stage { height: 60vh; }
  #panel { border-left: 0; border-top: 1px solid var(--line); padding: 18px 16px 40px; }
  #stepLabel { min-width: 0; }
}
@media (max-width: 560px) {
  header { padding: 14px 16px 12px; }
  form, .tasks { grid-template-columns: 1fr; }
  #stepLabel, #mapCtl input[type=range] { display: none; }
  .hud.tr { top: 60px; left: 14px; right: auto; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</head>
<body>
<header>
  <div class="brand">
    <h1>Inside GLiNER2.5</h1>
    <p>Follow a sentence through the model, layer by layer, until it finds the entities.</p>
  </div>
  <form id="form">
    <div class="field"><label for="text">Your sentence</label><input id="text" type="text" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label for="thr">Threshold</label><div class="thr"><input id="thr" type="range" min="0.05" max="0.95" step="0.05" value="0.5"><output id="thrOut">0.50</output></div></div>
    <button class="primary" id="go" type="submit">Analyze</button>
    <div class="tasks">
      <div class="field"><label for="fEnt">Entities</label><input id="fEnt" type="text" autocomplete="off" spellcheck="false" placeholder="person = named people, company" title="Entity types, comma-separated. Add a description after =."></div>
      <div class="field"><label for="fAttr">Attributes</label><input id="fAttr" type="text" autocomplete="off" spellcheck="false" placeholder="mood: happy, annoyed → person" title="group: labels → entity types it applies to. Separate groups with ;"></div>
      <div class="field"><label for="fCls">Classification</label><input id="fCls" type="text" autocomplete="off" spellcheck="false" placeholder="topic: tech, sports; tone: good, bad" title="task: labels. Separate tasks with ;"></div>
      <div class="field"><label for="fRel">Relations</label><input id="fRel" type="text" autocomplete="off" spellcheck="false" placeholder="works_for, located_in" title="Relation types, comma-separated."></div>
      <div class="field"><label for="fStr">Structure</label><input id="fStr" type="text" autocomplete="off" spellcheck="false" placeholder="launch: product*, company, place" title="name: fields. * marks the anchor field (default: the first). Separate structures with ;"></div>
    </div>
    <div class="sub" id="examples"><span>Examples:</span><span id="status"></span></div>
  </form>
</header>
<main>
  <nav id="rail" aria-label="Model stages"></nav>
  <section id="stage">
    <canvas id="scene" aria-label="3D model"></canvas>
    <div class="hud tl">
      <div class="seg" role="group" aria-label="View">
        <button id="vFlow" class="on" type="button">Walkthrough</button>
        <button id="vMap" type="button">Meaning map</button>
      </div>
    </div>
    <div class="hud tr">
      <button class="ghost" id="overview" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>Full view</button>
      <button class="ghost" id="sound" type="button" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 6h3l4-3v10l-4-3H2z"/><path id="waves" d="M11.5 5.5a3.5 3.5 0 0 1 0 5" opacity=".25"/></svg><span>Sound: off</span></button>
    </div>
    <div class="hud bc">
      <div id="flowCtl" style="display:flex;align-items:center;gap:2px">
        <button class="icon" id="prev" type="button" aria-label="Previous step"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 3 5 8l5.5 5z"/></svg></button>
        <button class="icon play" id="play" type="button" aria-label="Walk through the model"><svg viewBox="0 0 16 16" fill="currentColor"><path id="playIcon" d="M5 3v10l8-5z"/></svg></button>
        <button class="icon" id="next" type="button" aria-label="Next step"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 3 11 8l-5.5 5z"/></svg></button>
        <div id="stepLabel"></div>
      </div>
      <div id="mapCtl">
        <button class="icon play" id="mapPlay" type="button" aria-label="Play through the layers"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M5 3v10l8-5z"/></svg></button>
        <span>Layer</span><input id="mapLayer" type="range" min="0" max="12" step="1" value="0"><output id="mapLayerOut">0</output>
        <label><input type="checkbox" id="trails"> trails</label>
      </div>
    </div>
    <div id="hint">Press ▶ to follow your sentence. Drag to rotate, right-click to pan, scroll to zoom.</div>
    <div id="busy">Running your sentence through the model…</div>
  </section>
  <aside id="panel" aria-live="polite">
    <div class="follow" id="follow"></div>
    <div class="kicker" id="kicker"></div>
    <h2 id="ptitle">Loading the model…</h2>
    <p class="lede" id="plede"></p>
    <div role="tablist" id="tabs">
      <button role="tab" data-tab="what" aria-selected="true">What it does</button>
      <button role="tab" data-tab="mine" aria-selected="false">With your sentence</button>
      <button role="tab" data-tab="tech" aria-selected="false">Under the hood</button>
    </div>
    <div id="tabbody" role="tabpanel"></div>
  </aside>
</main>
<div id="tip"></div>
<div id="toast" role="alert"></div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const f2 = (v) => Number(v).toFixed(2);
const nf = (n) => Number(n).toLocaleString("en-US");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const argmax = (a) => a.reduce((b, v, i) => (v > a[b] ? i : b), 0);
const C = { bg: "#F3EEE5", paper: "#FBF8F2", wash: "#F7F1E7", plate: "#E8DFCE", ink: "#2B2926", muted: "#6E685F",
  terra: "#B85C3C", slate: "#4D6170", sand: "#D4B48C", olive: "#7C8A5A", schema: "#C3C9CD", cls: "#6A5A99" };
const LABEL_COLORS = ["#B85C3C", "#4D6170", "#7C8A5A", "#C0913A", "#8A5A6E", "#4F7F78", "#8C6A4F", "#3E7CA6", "#A84E62", "#6B8F3A", "#9C7A2E", "#5C6E8F"];
const LC = (q) => LABEL_COLORS[q % LABEL_COLORS.length];
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * clamp(t, 0, 1))).join(",")})`; };
const ramp = (v, to = C.terra) => mix(C.paper, to, v);
const diverge = (v) => (v >= 0 ? mix(C.paper, C.terra, v) : mix(C.paper, C.slate, -v));

// ---------- state ----------
const S = { step: 0, overview: true, label: 0, focusTok: 0, view: "flow", tab: "what", playing: false, sound: false, mapLayer: 0, mapPlaying: false };

  g.font = font;

  c.width = w; c.height = h;

}

}

  if (dot) return selectStep(STEPS.findIndex((s) => s.layer === +dot.dataset.layer && s.key === "layer"));
  const it = e.target.closest("[data-g]");
  if (!it) return;
  const gi = +it.dataset.g, cur = STEPS[S.step];
  if (!S.overview && cur.g === gi) return;
  selectStep(STEPS.findIndex((s) => s.g === gi));
});
function renderStepper() {
  $("#stepLabel").innerHTML = S.overview ? "<b>Full view</b> · press ▶ to start" : `Step ${S.step + 1} of ${STEPS.length} · <b>${esc(stepTitle(STEPS[S.step]))}</b>`;
}

const qDesc = (q) => ({ entity: "Entity type", attribute: `Label of the attribute “${esc(q.group)}”, scored only at the entities found`,

function otherAnswers() {
  const L = D.input.labels, li = [];

  D.attributes.forEach((a) => a.items.forEach((it) => { const j = argmax(it.probs); li.push(`<li><span>“${esc(D.input.text.slice(it.start, it.end))}” · ${esc(a.group)}</span><span>${esc(a.labels[j])} <span class="num">${f2(it.probs[j])}</span></span></li>`); }));
  D.relations.filter((r) => r.kept).forEach((r) => li.push(`<li><span>“${esc(r.head_text)}” → “${esc(r.tail_text)}”</span><span>${esc(r.type)} <span class="num">${f2(r.prob)}</span></span></li>`));
  D.records.forEach((g) => g.result.forEach((rec) => li.push(`<li><span>${esc(g.name)}</span><span>${Object.entries(rec).map(([k, v]) => `${esc(k)}: “${esc(v?.text ?? "—")}”`).join(", ")}</span></li>`)));
  return li.length ? `<h3>Other answers</h3><ul class="list">${li.join("")}</ul>` : "";
}
const pc = (t, id = false) => `<span class="pc ${t.kind}">${esc(t.piece)}${id ? `<span class="id">${t.id}</span>` : ""}</span>`;
const strip = (vals) => { const m = Math.max(...vals.map(Math.abs)) || 1; return `<div class="strip">${vals.map((v) => `<i style="background:${diverge(v / m)}"></i>`).join("")}</div>`; };
const bars = (rows) => `<div class="bars">${rows.map(([name, v, max = 1]) => `<span>${name}</span><div class="bar"><i style="width:${clamp((v / max) * 100, 0, 100)}%"></i></div><span class="num">${f2(v)}</span>`).join("")}</div>`;
const pctOf = (a, b) => Math.round((100 * a) / b);
const gapName = (j) => j === 0 ? "before the first word" : j === D.W ? "after the last word" : `between “${esc(D.words[j - 1].text)}” and “${esc(D.words[j].text)}”`;
function spanGroups(ents) {
  const groups = [];
  [...ents].sort((a, b) => a.start - b.start || b.end - a.end).forEach((e) => {
    const g = groups.at(-1);
    if (g && g.start === e.start && g.end === e.end) g.labels.push(e.label);
    else groups.push({ start: e.start, end: e.end, labels: [e.label] });
  });

}
function highlighted(ents) {
  const txt = D.input.text;
  let out = "", at = 0;
  spanGroups(ents).forEach((g) => {
    if (g.start < at) return;
    out += esc(txt.slice(at, g.start)) + `<mark style="--c:${LC(g.labels[0])}">${esc(txt.slice(g.start, g.end))}<sup>${g.labels.map((q) => esc(D.input.labels[q])).join(" · ")}</sup></mark>`;
    at = g.end;
  });
  return `<div class="sentence">${out + esc(txt.slice(at))}</div>`;
}

    mine: () => {
      const top = [...D.candidates].sort((a, b) => b.prior - a.prior).slice(0, 10);
      return `<div class="big"><div><b>${D.W + 1}</b><span>gaps</span></div><div><b>${nf(D.pool.possible)}</b><span>possible stretches</span></div><div><b>${D.pool.kept}</b><span>in the bag (max. ${nf(INFO.pool_size)})</span></div></div>
        <p>Each arc in the 3D view is a candidate: it goes from the gap where it starts to the gap where it ends. These are the 10 with the best prior score (start–end fit, before looking at the label):</p>
        <ul class="list">${top.map((c) => `<li><span>“${esc(c.text)}”</span><span class="num">${c.s}→${c.e} · ${f2(c.prior)}</span></li>`).join("")}</ul>`;
    },
    tech: () => `<dl class="tech"><dt>DocumentCandidatePool</dt><dd>Maximum of the start/end logits over the queries, top-${INFO.pool_top_k} per side, Cartesian product with end > start, start·end compatibility, a minimum quota per query and deduplication.</dd>
      <dt>Settings</dt><dd><code>pool_boundary_top_k = ${INFO.pool_top_k}</code>, <code>pool_size = ${INFO.pool_size}</code>. You can set them when you load the model.</dd>
      <dt>Code</dt><dd class="file">gliner2/models/boundary/pool.py · DocumentCandidatePool</dd></dl>`,
  },
  score: {
    what: () => `<p>Each candidate becomes a vector that sums up <b>where it starts, where it ends, how long it is and what it contains</b>.</p>
      <p>That vector is compared with each query, and out comes a probability from 0 to 1: is “${esc(D.candidates[0]?.text ?? "")}” a ${esc(D.input.labels[S.label])}? The starts, ends and inside scores from stage 7 are added to it.</p>
      <p>In the 3D view, the higher the arc, the higher the probability for ${labChip(S.label)}. Thick arcs pass the threshold (${f2(D.input.threshold)}).</p>`,
    mine: () => {
      const thr = D.input.threshold, top = D.candidates.slice(0, 12);
      return `<p>The 12 candidates with the highest score for any query:</p><div style="overflow-x:auto"><table class="heat"><thead><tr><th></th>${D.input.labels.map((l) => `<th style="font-family:var(--sans);font-size:11px">${esc(l)}</th>`).join("")}</tr></thead><tbody>
        ${top.map((c) => `<tr><th>“${esc(c.text)}”</th>${c.probs.map((v, q) => `<td class="v ${v >= thr ? "hit" : ""}" style="background:${v >= thr ? LC(q) : ramp(v * 0.8, LC(q))}">${f2(v)}</td>`).join("")}</tr>`).join("")}
        </tbody></table></div><p style="font-size:13px;color:var(--muted)">Solid fill = passes the threshold ${f2(thr)}.</p>`;
    },
    tech: () => `<dl class="tech"><dt>SharedPoolScorer</dt><dd>Candidate vector = start + end + length features (log, relative, 1/√) + prior score + content (mean and log-sum-exp of the stretch), with LayerNorm.</dd>
      <dt>Score</dt><dd>Dot product with the query + an MLP modulated by the label (FiLM: γ, β) + start/end logits + mean “inside”. Probability = sigmoid.</dd>
      <dt>Shape</dt><dd><code>[1, ${D.pool.kept}, ${D.Q}]</code> (candidates × queries). Parameters: ${nf(INFO.params.scorer)}.</dd>
      <dt>Code</dt><dd class="file">gliner2/models/boundary/pool.py · SharedPoolScorer</dd></dl>`,
  },
  decide: {
    what: () => `<p>Three filters remain:</p>
      <ol><li><b>Is there any?</b> A detector per query can say “there is none in this text” and drop the whole query.</li>
      <li><b>Threshold.</b> Only candidates with a score ≥ ${f2(D.input.threshold)} pass. Move the threshold at the top and analyze again.</li>
      <li><b>Overlaps.</b> Within one query, if two stretches overlap, the non-overlapping combination with the highest total score wins.</li></ol>
      <p>What is left is the answer, with the exact position of each entity in the original text.</p>`,
    mine: () => {
      const thr = D.input.threshold, abs = D.abstention_threshold;
      const lost = [];
      D.candidates.forEach((c) => c.probs.forEach((v, q) => { if (v >= thr && !c.final.includes(q)) lost.push([c, q, v]); }));
      const twice = spanGroups(D.entities).filter((g) => g.labels.length > 1);
      return `${highlighted(D.entities)}
        ${twice.length ? `<div class="note key">“${esc(D.input.text.slice(twice[0].start, twice[0].end))}” comes out with ${twice[0].labels.length} labels. This model resolves overlaps within each query, but not between different queries. If you want only one, decide afterwards, for example by keeping the highest score.</div>` : ""}
        <ul class="list" style="margin-top:12px">${D.entities.map((e) => `<li><span>${labChip(e.label)} “${esc(e.text)}”</span><span class="num">${f2(e.score)}</span></li>`).join("") || "<li>No entity passes the threshold.</li>"}</ul>
        ${D.null ? `<h3>Is there any for each query?</h3>${bars(D.input.labels.map((l, q) => [labChip(q), 1 - D.null[q]]))}<p style="font-size:13px;color:var(--muted);margin-top:6px">If it falls below ${f2(1 - abs)}, that query is dropped.</p>` : ""}
        ${lost.length ? `<h3>Passed the threshold but were discarded</h3><ul class="list">${lost.slice(0, 8).map(([c, q, v]) => `<li><span>${labChip(q)} “${esc(c.text)}”</span><span class="num">${f2(v)} · ${D.null && D.null[q] > abs ? "query dropped" : "overlaps"}</span></li>`).join("")}</ul>` : ""}`;
    },
    tech: () => `<dl class="tech"><dt>Abstention</dt><dd><code>null_projection</code> per query; the query is dropped if its probability is above ${f2(D.abstention_threshold)}.</dd>
      <dt>Overlaps</dt><dd><code>overlap_policy = "flat"</code>: per query, it selects the non-overlapping intervals with the maximum sum of scores. Overlaps between different queries are not resolved here.</dd>
      <dt>Positions</dt><dd>The start and end maps of each word translate gaps into character offsets.</dd>
      <dt>Code</dt><dd class="file">gliner2/models/boundary/engine.py · _decode_entities</dd></dl>`,
  },
  map: {
    what: () => `<p>Each point is a piece of your input. Its ${INFO.hidden} numbers cannot be drawn, so we sum them up in 3 (principal component analysis). <b>Nearby pieces = similar representations.</b></p>
      <p>Move the layer slider or press ▶. In the embeddings (layer 0), markers of the same kind (all <code>[E]</code>, all <code>[R]</code>…) sit on the same point, because they do not know yet which query they belong to. Layer by layer they move apart, and the text reorganizes by its role in the sentence.</p>
      <div class="note">It is a projection: distances in 3D are approximate. The thin line joins the selected query with the word it is most similar to, measured with the real ${INFO.hidden} numbers.</div>`,
    mine: () => {
      const L = D.layers[S.mapLayer];
      return `<p>In ${S.mapLayer === 0 ? "the embeddings (layer 0)" : `layer ${S.mapLayer}`}, each query is most similar to:</p>
        <ul class="list">${D.input.labels.map((l, q) => { const j = argmax(L.label_sim[q]); return `<li><span>${labChip(q)} → “${esc(D.words[j].text)}”</span><span class="num">${f2(L.label_sim[q][j])}</span></li>`; }).join("")}</ul>
        ${S.mapLayer === 0 ? `<p style="font-size:13px;color:var(--muted);margin-top:8px">In layer 0, queries with the same kind of marker give the same answer: their markers are identical.</p>` : ""}`;
    },
    tech: () => `<dl class="tech"><dt>Projection</dt><dd>3D PCA of each layer's normalized vectors, aligned with the previous layer (Procrustes) so the points move smoothly.</dd>
      <dt>Similarity</dt><dd>Cosine similarity between the vector of the query marker and the first piece of each word, in ${INFO.hidden} dimensions.</dd></dl>`,
  },
};
function techModel() {
  const P = INFO.params;
  return `<dl class="tech"><dt>Model</dt><dd><code>${esc(INFO.name)}</code>: ${esc(INFO.encoder)} encoder (mDeBERTa-v3) + boundary head.</dd>
    <dt>Size</dt><dd>${nf(P.total)} parameters: embeddings ${pctOf(P.embeddings, P.total)}%, Transformer layers ${pctOf(P.encoder - P.embeddings, P.total)}%, boundary head ${((100 * (P.boundary_encoder + P.query_head + P.pool + P.scorer)) / P.total).toFixed(1)}%.</dd>
    <dt>Encoder</dt><dd>${INFO.layers} layers, ${INFO.hidden} dimensions, ${INFO.heads} attention heads.</dd>
    <dt>Head</dt><dd>Gaps of ${INFO.boundary_dim} dims · bag of top-${INFO.pool_top_k} × top-${INFO.pool_top_k}, at most ${INFO.pool_size} candidates.</dd>
    <dt>Not drawn yet</dt><dd>The tower follows the span path that entity types, attribute labels, relation roles and structure fields share. The classification, attribute, relation and record heads on top of it are summed up in “With your sentence”.</dd></dl>`;
}
function renderPanel() {
  if (!INFO) return;
  $("#follow").innerHTML = D ? `<span>Following:</span>${D.groups.filter((g) => g.q.length).map((g) => `<span class="fg"><small>${esc(groupTitle(g))}</small>${g.q.map((q) => `<button type="button" class="lab ${q === S.label ? "on" : ""}" style="--c:${LC(q)}" data-q="${q}">${esc(D.queries[q].short)}</button>`).join("")}</span>`).join("")}` : "";
  if (!D) return;
  const key = S.view === "map" ? "map" : S.overview ? "overview" : STEPS[S.step].key;
  const st = STEPS[S.step], g = GROUPS[st.g];
  $("#kicker").textContent = S.view === "map" ? "Alternative view" : S.overview ? `${STEPS.length} steps · ${GROUPS.length} stages` : `Step ${S.step + 1} of ${STEPS.length}`;
  $("#ptitle").textContent = S.view === "map" ? "Meaning map" : S.overview ? "A sentence travels through the model" : stepTitle(st) + (st.key === "layer" ? " · Transformer" : "");
  $("#plede").textContent = S.view === "map" ? "Where the model places each piece, layer by layer." : S.overview ? "From your text and schema to the answers, in ten stages." : g.short;
  document.querySelectorAll("[role=tab]").forEach((b) => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  $("#tabbody").innerHTML = CONTENT[key][S.tab](st);
}
$("#tabs").addEventListener("click", (e) => { const b = e.target.closest("[data-tab]"); if (!b) return; S.tab = b.dataset.tab; renderPanel(); blip(600, 0.05, 0.012); });
$("#follow").addEventListener("click", (e) => { const b = e.target.closest("[data-q]"); if (b) setLabel(+b.dataset.q); });

// ---------- data ----------
function prep(d) {
  const sch = d.input.schema;
  d.choices = d.classifications.flatMap((c, ti) => c.labels.map((label, j) => ({ task: c.task, label, ti, j })));
  d.queries.forEach((q) => {
    const g = q.type === "entities" ? Object.keys(sch.attributes).find((a) => q.role.startsWith(a + ": ")) : null;
    q.kind = q.type === "json_structures" ? "structure" : q.type === "relations" ? "relation" : g ? "attribute" : "entity";
    q.group = q.kind === "entity" ? "entities" : g ?? q.task;
    q.short = g ? q.role.slice(g.length + 2) : q.role;
    q.anchor = q.kind === "structure" && sch.structures[q.task]?.anchor === q.role;
  });
  // span queries grouped by the task that owns them, then one group per classification task
  d.groups = [];
  d.queries.forEach((q, i) => { const g = d.groups.at(-1); if (g && g.name === q.group && g.kind === q.kind) g.q.push(i); else d.groups.push({ name: q.group, kind: q.kind, q: [i], c: [] }); });
  d.classifications.forEach((c, ti) => d.groups.push({ name: c.task, kind: "classification", q: [], c: d.choices.flatMap((x, ci) => (x.ti === ti ? [ci] : [])) }));
  // what each schema piece names: a span query, a classification choice or a description
  let cur = null;
  d.tokens.forEach((t) => {
    t.ci = t.cls ? d.choices.findIndex((c) => c.ti === t.cls[0] && c.j === t.cls[1]) : null;
    if (t.kind === "marker") { cur = t.label != null ? { lab: t.label } : t.ci != null ? { ci: t.ci } : t.piece === "[DESCRIPTION]" ? { desc: true } : null; t.lab = t.label; }
    else if (t.kind === "schema") {
      if (t.piece.includes("(") || t.piece.includes(")")) cur = null;
      const named = cur && /[\p{L}\p{N}]/u.test(t.piece);
      t.lab = named ? cur.lab ?? null : null; t.ci = named ? cur.ci ?? null : null; t.desc = !!(named && cur.desc);
    } else t.lab = null;
  });
  d.W = d.words.length; d.Q = d.input.labels.length; d.T = d.tokens.length;
  d.candidates.forEach((c) => (c.final = d.entities.filter((e) => e.start === c.cs && e.end === c.ce).map((e) => e.label)));
  const up = /[A-ZÁÉÍÓÚÑÜ]/;
  d.lower = up.test(d.input.text) && !d.tokens.some((t) => t.kind === "text" && up.test(t.piece));
}
// Plain form syntax -> /api/analyze schema. Commas separate items, ";" separates groups, ":" names a group.
function parseSchema() {
  const list = (s) => s.split(",").map((x) => x.trim()).filter(Boolean);
  const groups = (sel, what) => $(sel).value.split(";").map((x) => x.trim()).filter(Boolean).map((g) => {
    const i = g.indexOf(":");
    if (i < 1) throw new Error(`Write ${what} as “name: a, b, c”.`);
    return [g.slice(0, i).trim(), g.slice(i + 1).trim()];
  });
  const entities = Object.fromEntries(list($("#fEnt").value).map((e) => { const [n, d] = e.split("="); return [n.trim(), d?.trim() || null]; }));
  const attributes = Object.fromEntries(groups("#fAttr", "attributes").map(([g, rest]) => { const [labels, to] = rest.split(/→|->/); return [g, { labels: list(labels), applies_to: to ? list(to) : null }]; }));
  const classifications = Object.fromEntries(groups("#fCls", "classifications").map(([t, rest]) => [t, list(rest)]));
  const structures = Object.fromEntries(groups("#fStr", "structures").map(([n, rest]) => {
    const fields = list(rest), anchor = fields.find((f) => f.endsWith("*"));
    return [n, { fields: fields.map((f) => f.replace(/\*$/, "").trim()), anchor: anchor ? anchor.replace(/\*$/, "").trim() : null }];
  }));
  return { entities, attributes, classifications, relations: list($("#fRel").value), structures };
}
const fill = (x) => { $("#text").value = x.text; Object.entries(FIELDS).forEach(([k, sel]) => ($(sel).value = x[k] ?? "")); };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (t.style.display = "none"), 5000); }
async function analyze() {
  let schema;
  try { schema = parseSchema(); } catch (e) { return toast(e.message); }
  if (!Object.keys(schema.entities).length && !schema.relations.length && !Object.keys(schema.structures).length)
    return toast("Add at least one entity type, relation or structure: the walkthrough follows the span path.");
  const body = { text: $("#text").value, threshold: +$("#thr").value, ...schema };
  $("#go").disabled = true; $("#busy").classList.add("on"); stopPlay();
  try {
    const r = await fetch("/api/analyze", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    const first = !D;
    prep(j); D = j;
    S.label = 0; S.focusTok = D.markers[0]; S.mapLayer = first ? 0 : S.mapLayer;
    buildTower(); buildMap(); updateHeights();
    $("#status").textContent = `${INFO.name} · ${D.ms} ms`;
    if (first || S.overview) overview(); else selectStep(S.step);
    if (S.view === "map") setView("map");
    renderRail(); renderPanel();
  } catch (e) {
    toast(e instanceof TypeError ? "Cannot reach the server. Start it with: uv run server.py" : e.message);
  } finally { $("#go").disabled = false; $("#busy").classList.remove("on"); }
}

// ---------- wiring ----------
$("#form").addEventListener("submit", (e) => { e.preventDefault(); analyze(); });
$("#thr").addEventListener("input", (e) => ($("#thrOut").textContent = f2(e.target.value)));
EXAMPLES.forEach((x) => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = x.name;
  b.onclick = () => { fill(x); analyze(); };
  $("#status").before(b);
});
$("#prev").onclick = () => { stopPlay(); S.overview ? selectStep(0) : selectStep(S.step - 1); };
$("#next").onclick = () => { stopPlay(); S.overview ? selectStep(0) : selectStep(S.step + 1, { flow: true }); };
$("#play").onclick = play;
$("#overview").onclick = overview;
$("#vFlow").onclick = () => setView("flow");
$("#vMap").onclick = () => setView("map");
$("#mapLayer").oninput = (e) => { S.mapLayer = +e.target.value; S.mapPlaying = false; mapRefresh(); };
$("#mapPlay").onclick = mapPlay;
$("#trails").onchange = mapRefresh;
$("#sound").onclick = () => {
  S.sound = !S.sound;
  $("#sound").setAttribute("aria-pressed", S.sound);
  $("#sound span").textContent = `Sound: ${S.sound ? "on" : "off"}`;
  $("#waves").setAttribute("opacity", S.sound ? 1 : 0.25);
  chime();
};
addEventListener("keydown", (e) => {
  if (!D || e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); $("#next").click(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); $("#prev").click(); }
  if (e.key === " ") { e.preventDefault(); S.view === "map" ? mapPlay() : play(); }
});

// ---------- start ----------
(async () => {
  renderRail();
  await Promise.all(['500 52px Inter', '600 58px "Playfair Display"', '500 44px "IBM Plex Mono"'].map((f) => document.fonts.load(f))).catch(() => {});
  try {
    INFO = await (await fetch("/api/info")).json();
  } catch {
    $("#ptitle").textContent = "Server not available";
    $("#tabbody").innerHTML = `<p>Start the server from this folder:</p><p><code>uv run server.py</code></p><p>and open <code>http://localhost:8765</code>.</p>`;
    return;
  }
  buildSteps(INFO.layers);
  $("#mapLayer").max = INFO.layers;
  renderRail();
  fill(EXAMPLES[0]);
  analyze();
})();
</script>
</body>
</html>
